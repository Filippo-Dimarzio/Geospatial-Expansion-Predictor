[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-predictor"
version = "0.2.0"
description = "Geospatial Micro-Level Market Potential Predictor for dark-store siting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-folium>=0.18.0",
    "folium>=0.15.0",
    "plotly>=5.22.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "rasterstats>=0.19.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0.0"]
roads = ["osmnx>=1.9.0"]
extract = ["exactextract>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-requests",
]
all = ["market-predictor[ml,roads,extract,dev]"]

[project.scripts]
market-predictor = "market_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests", "*.py"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["market_predictor"]
